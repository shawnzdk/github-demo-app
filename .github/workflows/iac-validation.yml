name: GitHub IaC Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  validate:

    name: Validate Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python
        run: |
          python -m py_compile app.py
          echo "Python validation: OK"

      - name: Build Docker image
        run: |
          docker build \
            -t github-demo-app:${{ github.sha }} \
            .

      - name: GitHub validation
        run: |
          echo "Repository validated successfully"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"


  infrastructure-integration:

    name: Validate IaC Infrastructure Integration

    needs: validate

    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Runner information
        run: |
          echo "===================================="
          echo " GitHub -> IaC Infrastructure"
          echo "===================================="

          echo "Runner:"
          hostname

          echo
          echo "User:"
          whoami

          echo
          echo "Repository:"
          echo "${{ github.repository }}"

          echo
          echo "Branch:"
          echo "${{ github.ref_name }}"

          echo
          echo "Commit:"
          echo "${{ github.sha }}"

      - name: Validate portal
        run: |
          curl --fail \
            --max-time 10 \
            http://127.0.0.1:8080/api/status

          echo
          echo "IaC Portal: REACHABLE"

      - name: Integration summary
        run: |
          echo "===================================="
          echo " GitHub Integration VALIDATED"
          echo "===================================="
          echo "GitHub Actions       : OK"
          echo "Self-hosted Runner   : OK"
          echo "IaC Portal           : OK"
